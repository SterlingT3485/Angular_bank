<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow">
        <div class="card-header banking-header">
          <h3 class="card-title mb-0">
            <i class="fas fa-plus-circle me-2"></i>
            Create New Account
          </h3>
        </div>

        <div class="card-body">
          <form [formGroup]="accountForm" (ngSubmit)="onSubmit()">

            <!-- Account Holder Name -->
            <div class="mb-3">
              <label for="accountHolderName" class="form-label">
                Account Holder Name <span class="text-danger">*</span>
              </label>
              <input type="text" id="accountHolderName" class="form-control" formControlName="accountHolderName"
                [class.is-invalid]="formControls['accountHolderName'].invalid && formControls['accountHolderName'].touched"
                placeholder="Enter full name">

              <div *ngIf="formControls['accountHolderName'].invalid && formControls['accountHolderName'].touched"
                class="invalid-feedback">
                <div *ngIf="formControls['accountHolderName'].errors?.['required']">
                  Account holder name is required
                </div>
                <div *ngIf="formControls['accountHolderName'].errors?.['minlength']">
                  Name must be at least 2 characters long
                </div>
                <div *ngIf="formControls['accountHolderName'].errors?.['maxlength']">
                  Name cannot exceed 50 characters
                </div>
              </div>
            </div>

            <!-- Account Type -->
            <div class="mb-3">
              <label class="form-label">
                Account Type <span class="text-danger">*</span>
              </label>

              <div class="row g-3">
                <!-- Chequing Account Radio Button -->
                <div class="col-md-6">
                  <div class="form-check account-type-card h-100">
                    <input class="form-check-input" type="radio" name="accountType" id="chequing" value="Chequing"
                      formControlName="accountType">
                    <label class="form-check-label w-100 h-100 d-flex flex-column justify-content-center"
                      for="chequing">
                      <div class="text-center">
                        <i class="fas fa-money-bill-wave fa-2x text-success mb-2"></i>
                        <h6 class="card-title mb-1">Chequing Account</h6>
                        <small class="text-muted">Easy access to your funds</small>
                      </div>
                    </label>
                  </div>
                </div>

                <!-- Savings Account Radio Button -->
                <div class="col-md-6">
                  <div class="form-check account-type-card h-100">
                    <input class="form-check-input" type="radio" name="accountType" id="savings" value="Savings"
                      formControlName="accountType">
                    <label class="form-check-label w-100 h-100 d-flex flex-column justify-content-center" for="savings">
                      <div class="text-center">
                        <i class="fas fa-piggy-bank fa-2x text-warning mb-2"></i>
                        <h6 class="card-title mb-1">Savings Account</h6>
                        <small class="text-muted">Earn interest on your deposits</small>
                      </div>
                    </label>
                  </div>
                </div>
              </div>

              <!-- Validation Error for Account Type -->
              <div *ngIf="formControls['accountType'].invalid && formControls['accountType'].touched"
                class="invalid-feedback d-block">
                Please select an account type
              </div>
            </div>

            <!-- Initial Balance -->
            <div class="mb-3">
              <label for="initialBalance" class="form-label">
                Initial Balance <span class="text-danger">*</span>
              </label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" id="initialBalance" class="form-control" formControlName="initialBalance"
                  [class.is-invalid]="formControls['initialBalance'].invalid && formControls['initialBalance'].touched"
                  min="0" step="0.01" placeholder="0.00">
              </div>

              <div *ngIf="formControls['initialBalance'].invalid && formControls['initialBalance'].touched"
                class="invalid-feedback">
                <div *ngIf="formControls['initialBalance'].errors?.['required']">
                  Initial balance is required
                </div>
                <div *ngIf="formControls['initialBalance'].errors?.['min']">
                  Balance cannot be negative
                </div>
              </div>

              <div class="form-text">
                <small class="text-muted">Minimum deposit: $0.00</small>
              </div>
            </div>

            <!-- Submit Message -->
            <div *ngIf="submitMessage" class="alert" [class.alert-success]="submitMessage.includes('successfully')"
              [class.alert-danger]="submitMessage.includes('Error')">
              {{ submitMessage }}
            </div>

            <!-- Action Buttons -->
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
              <app-custom-button text="Back" type="secondary" size="md" (clicked)="navigateBack()">
              </app-custom-button>

              <app-custom-button text="{{ isSubmitting ? 'Creating...' : 'Create Account' }}"
                [accountType]="formControls['accountType'].value" size="md"
                [disabled]="accountForm.invalid || isSubmitting" (clicked)="onSubmit()">
              </app-custom-button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
